<script>

   if(uMode==4.) theme=mix(cold,warm,.22); else if(uMode==5.) theme=mix(cold,vec3(.50,.70,.96),.24); else if(uMode==3.) theme=mix(cold,icy,.17);

 vec3 aura=vec3(.05,.16,.22)*exp(-pow((d-1.018)*16.,2.))*.72; if(uMode==1.)aura*=1.18; if(uMode==3.)aura*=1.28; if(uMode==4.)aura=mix(aura,vec3(.16,.11,.05),.22); if(uMode==5.)aura=mix(aura,vec3(.05,.11,.22),.28); col+=aura*(.8+uLevel*.42+uAccent*.8);

const strands=Array.from({length:132},(_,i)=>({id:i,angle:i*2.39996322972865,offset:(i%17)/17,tilt:Math.sin(i*37.91)*.55,speed:.75+((i*7)%17)/29,hue:i%23===0?'amber':i%7===0?'violet':'ice'}));

 ctx.clearRect(0,0,W,H); const small=Math.min(W,H),radius=small*.312; const cx=W*.5,cy=H*.5-small*.024; const rotY=t*.16,rotX=.20+.12*Math.sin(t*.25); const pulse=1+.017*Math.sin(t*2.4)+lev*.022 + accent*.02;

   const sweep=(t*1.25)%(Math.PI*2); ctx.fillStyle='rgba(104,167,255,.06)'; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,radius*1.42,sweep-.18,sweep+.18); ctx.closePath(); ctx.fill();
   ctx.strokeStyle='rgba(132,194,255,.35)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(sweep)*radius*1.42,Math.sin(sweep)*radius*1.42); ctx.stroke();
   for(let i=0;i<6;i++){ let a=sweep+i*1.03, rr=radius*(1.15+(i%3)*.09); circle(Math.cos(a)*rr,Math.sin(a)*rr,2.2,null,`rgba(151,205,255,${.22+.1*Math.sin(t*4+i)})`); }
 }
 if(accent>0.02){ ctx.globalAlpha=Math.min(.55,accent*.5); circle(0,0,radius*(1.07+accent*.15),`rgba(215,241,255,${.18*accent})`,null,1.5); }
 ctx.restore();
}
function draw(now){ let dt=clamp((now-previous)/1000,0,.08); previous=now; if(playing) elapsed=(elapsed+dt)%12; if(demo){ let mode=modeForTime(elapsed); if(mode!==state) active(mode);} let mode=state; let base={idle:.16,listening:.42,thinking:.31,speaking:.58,working:.44,searching:.39}[mode]; let amt=base;
 if(mode==='speaking') amt+=.18*Math.abs(Math.sin(now*.011))+.08*Math.abs(Math.sin(now*.023));
 else if(mode==='listening') amt+=.08*Math.abs(Math.sin(now*.007));
 else if(mode==='working') amt+=.06*Math.abs(Math.sin(now*.005))+.04*Math.abs(Math.sin(now*.019));
 else if(mode==='searching') amt+=.05*Math.abs(Math.sin(now*.009));
 else if(mode==='thinking') amt+=.04*Math.sin(now*.004);
 amt=clamp(externLevel!==null ? externLevel : amt*.75+level*.25,0,1);
 accent*=Math.pow(.08,dt*.9); accent=clamp(accent,0,1);
 if(gl&&program){ gl.useProgram(program); gl.uniform2f(uniforms.res,gc.width,gc.height); gl.uniform1f(uniforms.time,elapsed); gl.uniform1f(uniforms.level,amt); gl.uniform1f(uniforms.mode,stateCode(mode)); gl.uniform1f(uniforms.accent,accent); gl.drawArrays(gl.TRIANGLES,0,3);} else { ctx.fillStyle='#03111c'; ctx.fillRect(0,0,W,H);} 
 drawWires(elapsed,amt,mode); $('seek').value=elapsed.toFixed(2); $('currentTime').textContent='00:'+String(Math.floor(elapsed)).padStart(2,'0'); requestAnimationFrame(draw); }
requestAnimationFrame(draw);
$('play').addEventListener('click',()=>{playing=!playing; $('play').textContent=playing?'Ⅱ':'▶';});
$('demo').addEventListener('click',()=>{demo=!demo; $('demo').style.color=demo?'#d5f6ff':'#9ab3c4'; $('status').innerHTML='<i class="dot"></i>'+(demo?'Demo automática activa':'Control manual activo');});
$('accent').addEventListener('click',()=>triggerAccent(1));
$('seek').addEventListener('input',e=>{elapsed=+e.target.value;});
$('intensity').addEventListener('input',e=>{level=+e.target.value; externLevel=level;});
document.querySelectorAll('.state').forEach(b=>b.addEventListener('click',()=>{active(b.dataset.state); demo=false; triggerAccent(.95);}));
window.JESSYCAOrb={
  setState(s){ if(s==='work') s='working'; if(s==='search') s='searching'; active(s); demo=false; triggerAccent(.9); },
  pulseAction(kind='generic',strength=1){ if(kind==='listen') active('listening'); else if(kind==='speak') active('speaking'); else if(kind==='work') active('working'); else if(kind==='search') active('searching'); else if(kind==='think') active('thinking'); demo=false; triggerAccent(clamp(strength,0,1.4)); },
  setAudioLevel(x){ externLevel=clamp(Number(x)||0,0,1); $('intensity').value=externLevel; if(state==='speaking'||state==='listening') triggerAccent(.25+externLevel*.75); },
  setDemoMode(on){ demo=!!on; }, play(){ playing=true; $('play').textContent='Ⅱ'; }, pause(){ playing=false; $('play').textContent='▶'; }, seek(t){ elapsed=clamp(Number(t)||0,0,11.999); }, getState(){ return state; }, getTime(){ return elapsed; }
};
})();
