[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jessyca-windows-mcp"
version = "0.1.0"
description = "Arquitectura base del asistente Jessyca impulsado por Model Context Protocol (MCP) para Windows 10 y 11."
readme = "Documentos/README.md"
authors = [
    { name = "Jessyca Open Source Community" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.scripts]
jessyca = "main:main"

[project.optional-dependencies]
mcp = ["fastmcp>=3.4.11,<4"]
documents = ["firecrawl-anydoc==0.2.4", "python-docx", "openpyxl", "python-pptx", "matplotlib"]
voice = ["SpeechRecognition>=3.10,<4", "numpy>=1.26", "sounddevice>=0.5,<1", "edge-tts>=7.3.1,<8", "pyttsx3>=2.99,<3", "pygame>=2.6,<3", "PyAudio>=0.2.14; sys_platform == 'win32'", "faster-whisper"]
desktop = ["Pillow>=10", "pyperclip>=1.9", "pyautogui>=0.9.54; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
vad = [
    "onnxruntime>=1.16.0,<=1.23.2",
]
browser = [
    "playwright>=1.40.0,<=1.50.0",
]
docling = [
    "docling>=2.0.0,<=2.133.0",
]
uiautomation = [
    "uiautomation>=2.0.18,<=2.0.29",
]
pywinauto = [
    "pywinauto>=0.6.8,<=0.6.9",
]
wakeword = [
    "openwakeword>=0.6.0,<=0.6.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "asyncio: mark test as an asyncio test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length rule ignored in favor of ruff formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "services", "tools", "utils"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "winreg.*",
]
ignore_missing_imports = true

[tool.setuptools]
py-modules = ["main"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "services*", "tools*", "utils*", "server*", "skills*", "interfaces*"]
exclude = ["tests*", "lab*", "reports*", "data*", "logs*", "benchmarks*"]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml", "*.txt"]

"interfaces.webui_bridge" = ["studio_static/*"]
