name: Voice Prosody Checks
on:
  pull_request:
    paths:
      - 'services/voice/streaming.py'
      - 'tests/fluency/test_natural_phrase_boundaries.py'
      - '.github/workflows/voice-prosody.yml'
jobs:
  voice-prosody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Validate streaming code and boundaries
        run: |
          python -m py_compile services/voice/streaming.py
          python -m unittest discover -s tests/fluency -p 'test_natural_phrase_boundaries.py' -v
