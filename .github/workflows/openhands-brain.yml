name: OpenHands Brain Provider
on:
  pull_request:
    paths:
      - 'core/cognitive_brain/openhands_provider.py'
      - 'core/cognitive_brain/brain_orchestrator.py'
      - 'tests/test_openhands_brain_provider.py'
      - '.github/workflows/openhands-brain.yml'
  workflow_dispatch:
jobs:
  provider-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JESSYCA package dependencies
        run: python -m pip install -e .
      - name: Compile OpenHands provider
        run: python -m py_compile core/cognitive_brain/openhands_provider.py core/cognitive_brain/brain_orchestrator.py
      - name: Isolated provider tests
        run: python -m unittest discover -s tests -p 'test_openhands_brain_provider.py' -v
