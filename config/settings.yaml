# Configuración general de Jessyca
system:
  name: "Jessyca"
  version: "0.1.0"
  language: "es-ES"
  debug: false

audio:
  default_voice: "es-PE-CamilaNeural"
  wake_word: "jessyca"
  wake_word_variations:
    - "jessyca"
    - "jessica"
    - "yesica"
    - "yessica"
    - "jesica"
    - "jesika"
    - "yesika"
    - "esica"
    - "sica"
    - "yeca"
  sample_rate: 16000
  channels: 1

browser:
  use_real_profile: true
  edge_user_data_dir: ""  # Vacío = C:\Users\<usuario>\AppData\Local\Microsoft\Edge\User Data
  edge_profile_directory: "Default"

logging:
  level: "INFO"
  console_output: true

# Configuración Mobile API Bridge (JESSYCA 4.0 Core ↔ Mobile)
mobile_api:
  enabled: true
  host: "0.0.0.0"
  port: 8765
  timeout: 30
  # Nota de seguridad: definir MOBILE_API_AUTH_TOKEN mediante variable de entorno o .env

# Configuración de Integraciones Externas (Integration Hub / Adapter Layer)
integrations:
  enabled: true
  adapters:
    jarvis:
      enabled: false
    are:
      enabled: false
    windows_computer_use:
      enabled: false

